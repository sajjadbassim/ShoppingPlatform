    <!-- شاشة البداية: تظهر فوراً قبل تنزيل ملفات التطبيق، ويستبدلها React عند جاهزيته -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; font-family: Tajawal, Cairo, system-ui, sans-serif; }
      .boot img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(79,70,229,.25); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { font-size: 20px; font-weight: 700; color: #111827; }
      .boot-track { width: 140px; height: 4px; border-radius: 4px; background: #EEF2FF; overflow: hidden; }
      .boot-track span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #4F46E5; animation: boot-slide 1.2s ease-in-out infinite; }
      .boot-slow { font-size: 13px; color: #6B7280; opacity: 0; animation: boot-show .4s ease 6s forwards; }
      @keyframes boot-pulse { 50% { transform: scale(.94); } }
      @keyframes boot-slide { 0% { transform: translateX(260%); } 100% { transform: translateX(-160%); } }
      @keyframes boot-show { to { opacity: 1; } }
      .dark .boot { background: #0B0F19; }
      .dark .boot-name { color: #F1F3F6; }
      .dark .boot-track { background: #252A4A; }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-track span { animation: none; } }
    </style>
